<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página no encontrada | Ignacio Sánchez Yuste</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #1e40af 100%);
      min-height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(139, 92, 246, 0.4);
      border-radius: 50%;
      animation: float linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-duration: 12s; animation-delay: 0s; width: 3px; height: 3px; }
    .particle:nth-child(2) { left: 20%; animation-duration: 15s; animation-delay: 1s; width: 5px; height: 5px; }
    .particle:nth-child(3) { left: 35%; animation-duration: 10s; animation-delay: 2s; }
    .particle:nth-child(4) { left: 50%; animation-duration: 14s; animation-delay: 0.5s; width: 6px; height: 6px; }
    .particle:nth-child(5) { left: 65%; animation-duration: 11s; animation-delay: 3s; width: 3px; height: 3px; }
    .particle:nth-child(6) { left: 75%; animation-duration: 13s; animation-delay: 1.5s; }
    .particle:nth-child(7) { left: 85%; animation-duration: 16s; animation-delay: 2.5s; width: 5px; height: 5px; }
    .particle:nth-child(8) { left: 90%; animation-duration: 9s; animation-delay: 0.8s; width: 3px; height: 3px; }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(720deg);
        opacity: 0;
      }
    }

    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 10;
      max-width: 600px;
      width: 100%;
    }

    /* Glass card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 404 Number */
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease infinite;
      margin-bottom: 0.5rem;
      letter-spacing: -0.05em;
      position: relative;
    }

    .error-code::after {
      content: '404';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(30px);
      opacity: 0.5;
      z-index: -1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 1rem;
      animation: fadeUp 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    .description {
      color: #c4b5fd;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      animation: fadeUp 0.6s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Astronaut icon */
    .icon-wrapper {
      margin-bottom: 1.5rem;
      animation: bounce 3s ease-in-out infinite;
    }

    .icon-wrapper svg {
      width: 64px;
      height: 64px;
      color: #a78bfa;
      margin: 0 auto;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    .btn:hover {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(139, 92, 246, 0.35);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* Decorative orbiting ring */
    .orbit {
      position: absolute;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spin 20s linear infinite;
      pointer-events: none;
    }

    .orbit::before {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #8b5cf6;
      border-radius: 50%;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
    }

    .orbit-2 {
      width: 420px;
      height: 420px;
      border-color: rgba(99, 102, 241, 0.1);
      animation-duration: 30s;
      animation-direction: reverse;
    }

    .orbit-2::before {
      background: #6366f1;
      width: 6px;
      height: 6px;
      top: -3px;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      color: #7c3aed;
      font-size: 0.8rem;
      opacity: 0.6;
    }

    @media (max-width: 640px) {
      .error-code {
        font-size: 5rem;
      }
      .title {
        font-size: 1.2rem;
      }
      .card {
        padding: 2rem 1.5rem;
        margin: 0 1rem;
      }
      .orbit, .orbit-2 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Background particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Orbiting rings -->
  <div class="orbit"></div>
  <div class="orbit orbit-2"></div>

  <!-- Main content -->
  <div class="container">
    <div class="card">
      <div class="icon-wrapper">
        <!-- Compass icon (lost navigation) -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.5 7.5-5.25 3.75L9 16.5l5.25-3.75L16.5 7.5z" />
        </svg>
      </div>

      <div class="error-code">404</div>
      <h1 class="title">Página no encontrada</h1>
      <p class="description">
        Parece que te has perdido en el código. La página que buscas no existe o ha sido movida a otra ubicación.
      </p>

      <a href="/" class="btn">
        <!-- Home icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Volver al inicio
      </a>
    </div>
  </div>

  <div class="footer">
    &copy; 2026 Ignacio Sánchez Yuste
  </div>
</body>
</html>
